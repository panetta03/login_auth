name: Infrastructure Deployment

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infrastructure.yml'

env:
  AWS_REGION: us-east-2
  TF_VERSION: '1.6.0'

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine state bucket name
        id: state-bucket
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          REGION="${{ env.AWS_REGION }}"
          # Use auto-generated name: auth-service-terraform-state-{env}-{region}
          BUCKET_NAME="auth-service-terraform-state-${ENV}-${REGION}"
          echo "bucket_name=${BUCKET_NAME}" >> $GITHUB_OUTPUT
          echo "State bucket name: ${BUCKET_NAME}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          if [ "${{ steps.check-backend.outputs.backend_configured }}" = "true" ]; then
            echo "Initializing Terraform with S3 backend..."
            terraform init \
              -backend-config="bucket=${{ steps.check-backend.outputs.bucket_name }}" \
              -backend-config="key=${{ github.event.inputs.environment || 'dev' }}/terraform.tfstate" \
              -backend-config="region=${{ env.AWS_REGION }}" \
              -backend-config="encrypt=true" \
              -backend-config="dynamodb_table=${{ steps.check-backend.outputs.bucket_name }}-lock"
          else
            echo "No S3 backend configured - initializing with local backend"
            terraform init -backend=false
          fi
        working-directory: infrastructure/terraform

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: infrastructure/terraform

      - name: Terraform Plan
        id: plan
        if: github.event.inputs.action == 'plan' || github.event_name == 'push'
        run: |
          terraform plan \
            -var-file="environments/${{ github.event.inputs.environment || 'dev' }}/terraform.tfvars" \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="terraform_state_bucket_name=${{ steps.state-bucket.outputs.bucket_name }}" \
            -out=tfplan \
            -no-color
        working-directory: infrastructure/terraform
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Check Auto-Apply Setting
        id: check-auto-apply
        run: |
          if [ "${{ vars.TERRAFORM_AUTO_APPLY }}" = "true" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "auto_apply=true" >> $GITHUB_OUTPUT
          else
            echo "auto_apply=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Apply
        # Apply runs when:
        # 1. Manually triggered with action='apply'
        # 2. Auto-apply is enabled via repository variable and this is a push event
        if: |
          github.event.inputs.action == 'apply' ||
          (github.event_name == 'push' && steps.check-auto-apply.outputs.auto_apply == 'true')
        run: |
          terraform apply -auto-approve -no-color tfplan
          
          # If we used local backend and state bucket was created, migrate to S3
          if [ "${{ steps.init.outputs.backend_type }}" = "local" ]; then
            BUCKET_NAME="${{ steps.state-bucket.outputs.bucket_name }}"
            ENV="${{ github.event.inputs.environment || 'dev' }}"
            
            # Check if bucket was created
            if aws s3api head-bucket --bucket "${BUCKET_NAME}" 2>/dev/null; then
              echo "Migrating Terraform state to S3 backend..."
              terraform init -migrate-state \
                -backend-config="bucket=${BUCKET_NAME}" \
                -backend-config="key=${ENV}/terraform.tfstate" \
                -backend-config="region=${{ env.AWS_REGION }}" \
                -backend-config="encrypt=true" \
                -backend-config="dynamodb_table=${BUCKET_NAME}-lock"
              echo "✓ State migrated to S3"
            fi
          fi
        working-directory: infrastructure/terraform

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve -no-color \
            -var-file="environments/${{ github.event.inputs.environment || 'dev' }}/terraform.tfvars" \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="terraform_state_bucket_name=${{ steps.state-bucket.outputs.bucket_name }}"
        working-directory: infrastructure/terraform

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: ${{ github.event_name }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

