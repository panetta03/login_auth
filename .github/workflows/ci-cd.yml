name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infrastructure.yml'
      - '.github/workflows/promote-to-prod.yml'
      - '.github/workflows/ci-cd.yml'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'jest.config.js'
      - '.eslintrc.js'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Terraform action (only used if infrastructure changes detected)'
        required: false
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

env:
  AWS_REGION: us-east-2
  TF_VERSION: '1.6.0'
  ECR_REPOSITORY: auth-service
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER || 'dev-auth-service-cluster' }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE || 'dev-auth-service' }}

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    outputs:
      plan_artifact_name: ${{ steps.plan-artifact-name.outputs.name }}
      environment: ${{ steps.environment.outputs.environment }}
      state_bucket_name: ${{ steps.state-bucket.outputs.bucket_name }}
      has_infrastructure: ${{ steps.changes.outputs.infra }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect infrastructure changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'infrastructure/**'
              - '.github/workflows/infrastructure.yml'
              - '.github/workflows/promote-to-prod.yml'
              - '.github/workflows/ci-cd.yml'

      - name: Configure AWS credentials
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.infra == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine Environment
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.infra == 'true'
        id: environment
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "Environment: ${ENV}"

      - name: Determine state bucket name
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.infra == 'true'
        id: state-bucket
        run: |
          ENV="${{ steps.environment.outputs.environment }}"
          REGION="${{ env.AWS_REGION }}"
          BUCKET_NAME="auth-service-terraform-state-${ENV}-${REGION}"
          echo "bucket_name=${BUCKET_NAME}" >> $GITHUB_OUTPUT
          echo "State bucket name: ${BUCKET_NAME}"

      - name: Setup Terraform
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.infra == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.infra == 'true'
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform
        continue-on-error: true

      - name: Create S3 bucket for Terraform state if needed
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.infra == 'true'
        run: |
          BUCKET_NAME="${{ steps.state-bucket.outputs.bucket_name }}"
          REGION="${{ env.AWS_REGION }}"
          
          if aws s3api head-bucket --bucket "${BUCKET_NAME}" --region "${REGION}" 2>/dev/null; then
            echo "S3 bucket '${BUCKET_NAME}' already exists"
          else
            echo "Creating S3 bucket '${BUCKET_NAME}' for Terraform state..."
            aws s3api create-bucket \
              --bucket "${BUCKET_NAME}" \
              --region "${REGION}" \
              --create-bucket-configuration LocationConstraint="${REGION}" || \
            aws s3api create-bucket \
              --bucket "${BUCKET_NAME}" \
              --region "${REGION}"
            
            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket "${BUCKET_NAME}" \
              --versioning-configuration Status=Enabled
            
            # Enable encryption
            aws s3api put-bucket-encryption \
              --bucket "${BUCKET_NAME}" \
              --server-side-encryption-configuration '{
                "Rules": [{
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }]
              }'
            
            # Block public access
            aws s3api put-public-access-block \
              --bucket "${BUCKET_NAME}" \
              --public-access-block-configuration \
                "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            
            echo "✓ S3 bucket created"
          fi

      - name: Create DynamoDB table for state locking if needed
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.infra == 'true'
        run: |
          BUCKET_NAME="${{ steps.state-bucket.outputs.bucket_name }}"
          TABLE_NAME="${BUCKET_NAME}-lock"
          REGION="${{ env.AWS_REGION }}"
          
          if aws dynamodb describe-table --table-name "${TABLE_NAME}" --region "${REGION}" 2>/dev/null; then
            echo "DynamoDB table '${TABLE_NAME}' already exists"
          else
            echo "Creating DynamoDB table '${TABLE_NAME}' for state locking..."
            aws dynamodb create-table \
              --table-name "${TABLE_NAME}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${REGION}"
            
            echo "Waiting for table to be active..."
            aws dynamodb wait table-exists --table-name "${TABLE_NAME}" --region "${REGION}"
            echo "✓ DynamoDB table created"
          fi

      - name: Terraform Init
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.infra == 'true'
        id: init
        run: |
          BUCKET_NAME="${{ steps.state-bucket.outputs.bucket_name }}"
          ENV="${{ steps.environment.outputs.environment }}"
          
          echo "Initializing Terraform with S3 backend..."
          terraform init \
            -backend-config="bucket=${BUCKET_NAME}" \
            -backend-config="key=${ENV}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${BUCKET_NAME}-lock" \
            -reconfigure
          echo "✓ Terraform initialized with S3 backend"
        working-directory: infrastructure/terraform

      - name: Terraform Validate
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.infra == 'true'
        id: validate
        run: terraform validate -no-color
        working-directory: infrastructure/terraform

      - name: Handle Stale Terraform Lock
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.infra == 'true'
        run: |
          echo "Removing any stale Terraform state locks..."
          BUCKET_NAME="${{ steps.state-bucket.outputs.bucket_name }}"
          TABLE_NAME="${BUCKET_NAME}-lock"
          ENV="${{ steps.environment.outputs.environment }}"
          STATE_KEY="${ENV}/terraform.tfstate"
          
          for LOCK_ID in "${BUCKET_NAME}/${STATE_KEY}" "${STATE_KEY}"; do
            terraform force-unlock -force "${LOCK_ID}" 2>&1 || true
          done
          
          SCAN_RESULT=$(aws dynamodb scan \
            --table-name "${TABLE_NAME}" \
            --region us-east-2 \
            --output json 2>/dev/null || echo '{"Items":[]}')
          
          if command -v jq >/dev/null 2>&1; then
            echo "$SCAN_RESULT" | jq -r '.Items[]?.LockID.S // empty' 2>/dev/null | while read LOCK_ID; do
              if echo "$LOCK_ID" | grep -q "${STATE_KEY}"; then
                aws dynamodb delete-item \
                  --table-name "${TABLE_NAME}" \
                  --key "{\"LockID\":{\"S\":\"${LOCK_ID}\"}}" \
                  --region us-east-2 2>&1 || true
              fi
            done
          else
            echo "$SCAN_RESULT" | grep -o '"LockID":\s*{"S":\s*"[^"]*"}' | grep -o '"[^"]*"' | tr -d '"' | grep -v "^LockID$" | while read LOCK_ID; do
              if echo "$LOCK_ID" | grep -q "${STATE_KEY}"; then
                aws dynamodb delete-item \
                  --table-name "${TABLE_NAME}" \
                  --key "{\"LockID\":{\"S\":\"${LOCK_ID}\"}}" \
                  --region us-east-2 2>&1 || true
              fi
            done
          fi
          echo "✓ Lock cleanup completed"
        working-directory: infrastructure/terraform
        continue-on-error: true

      - name: Terraform Plan
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.infra == 'true'
        id: plan
        run: |
          if [ -z "${{ secrets.DB_USERNAME }}" ] || [ -z "${{ secrets.DB_PASSWORD }}" ]; then
            echo "⚠️ Warning: DB_USERNAME or DB_PASSWORD secrets are not set. RDS creation will fail."
            echo "Please set these secrets in GitHub repository settings."
          fi
          
          terraform plan \
            -var-file="environments/${{ steps.environment.outputs.environment }}/terraform.tfvars" \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="terraform_state_bucket_name=${{ steps.state-bucket.outputs.bucket_name }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan-output.txt
        working-directory: infrastructure/terraform
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: |
          echo "❌ Terraform plan failed"
          exit 1
        working-directory: infrastructure/terraform

      - name: Display Plan Summary
        if: steps.plan.outcome == 'success'
        run: |
          echo "## 📋 Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`${{ steps.environment.outputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** \`${{ github.event.inputs.action || github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if grep -q "Plan:" plan-output.txt; then
            echo "### 📊 Resource Changes:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            grep "Plan:" plan-output.txt | head -1 >> $GITHUB_STEP_SUMMARY || true
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### Full Plan Output:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          cat plan-output.txt >> $GITHUB_STEP_SUMMARY || echo "Plan output not available" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "**⚠️ IMPORTANT: Review the plan above. The apply step requires manual approval.**" >> $GITHUB_STEP_SUMMARY
          fi
        working-directory: infrastructure/terraform

      - name: Get database URL from Terraform state
        id: get-db-url
        if: steps.plan.outcome == 'success'
        run: |
          echo "Getting database URL from Terraform state..."
          
          # Get database URL from outputs (Terraform is already initialized)
          DATABASE_URL=$(terraform output -raw database_url 2>/dev/null || echo "")
          
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️ Warning: Could not get database_url from Terraform outputs"
            echo "database_url=" >> $GITHUB_OUTPUT
          else
            echo "✓ Database URL retrieved (hidden for security)"
            echo "database_url=${DATABASE_URL}" >> $GITHUB_OUTPUT
          fi
        working-directory: infrastructure/terraform

      - name: Determine Plan Artifact Name
        id: plan-artifact-name
        if: steps.plan.outcome == 'success'
        run: |
          ENV="${{ steps.environment.outputs.environment }}"
          ARTIFACT_NAME="terraform-plan-${ENV}-${{ github.run_number }}"
          echo "name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "Plan artifact name: ${ARTIFACT_NAME}"

      - name: Upload Plan Artifact
        id: plan-artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan-artifact-name.outputs.name }}
          path: infrastructure/terraform/tfplan
          retention-days: 1

  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-plan
    outputs:
      database_url: ${{ steps.get-db-url.outputs.database_url }}
    environment: 
      name: ${{ needs.terraform-plan.outputs.environment }}
      # Manual approval required via GitHub Environment protection rules
    if: |
      needs.terraform-plan.result == 'success' &&
      (github.event.inputs.action == 'apply' || github.event_name == 'push') &&
      (github.event_name == 'workflow_dispatch' || needs.terraform-plan.outputs.has_infrastructure == 'true')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.terraform-plan.outputs.plan_artifact_name }}
          path: infrastructure/terraform/

      - name: Determine state bucket name
        id: state-bucket-apply
        run: |
          ENV="${{ needs.terraform-plan.outputs.environment }}"
          REGION="${{ env.AWS_REGION }}"
          BUCKET_NAME="auth-service-terraform-state-${ENV}-${REGION}"
          echo "bucket_name=${BUCKET_NAME}" >> $GITHUB_OUTPUT
          echo "State bucket name: ${BUCKET_NAME}"

      - name: Terraform Init (for apply)
        run: |
          BUCKET_NAME="${{ steps.state-bucket-apply.outputs.bucket_name }}"
          ENV="${{ needs.terraform-plan.outputs.environment }}"
          
          terraform init \
            -backend-config="bucket=${BUCKET_NAME}" \
            -backend-config="key=${ENV}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${BUCKET_NAME}-lock" \
            -reconfigure
        working-directory: infrastructure/terraform

      - name: Import existing state backend resources (if created by AWS CLI)
        run: |
          BUCKET_NAME="${{ steps.state-bucket-apply.outputs.bucket_name }}"
          TABLE_NAME="${BUCKET_NAME}-lock"
          ENV="${{ needs.terraform-plan.outputs.environment }}"
          
          if aws s3api head-bucket --bucket "${BUCKET_NAME}" 2>/dev/null; then
            echo "Attempting to import existing S3 bucket..."
            terraform import \
              -var-file="environments/${ENV}/terraform.tfvars" \
              -var="terraform_state_bucket_name=${BUCKET_NAME}" \
              -var="db_username=dummy" \
              -var="db_password=dummy" \
              module.state_backend.aws_s3_bucket.terraform_state "${BUCKET_NAME}" 2>/dev/null || echo "S3 bucket already in state or import failed"
          fi
          
          if aws dynamodb describe-table --table-name "${TABLE_NAME}" --region us-east-2 >/dev/null 2>&1; then
            echo "Attempting to import existing DynamoDB table..."
            terraform import \
              -var-file="environments/${ENV}/terraform.tfvars" \
              -var="terraform_state_bucket_name=${BUCKET_NAME}" \
              -var="db_username=dummy" \
              -var="db_password=dummy" \
              module.state_backend.aws_dynamodb_table.terraform_state_lock "${TABLE_NAME}" 2>/dev/null || echo "DynamoDB table already in state or import failed"
          fi
        working-directory: infrastructure/terraform
        continue-on-error: true

      - name: Handle Stale Terraform Lock (for apply)
        run: |
          echo "Removing any stale Terraform state locks..."
          BUCKET_NAME="${{ steps.state-bucket-apply.outputs.bucket_name }}"
          TABLE_NAME="${BUCKET_NAME}-lock"
          ENV="${{ needs.terraform-plan.outputs.environment }}"
          STATE_KEY="${ENV}/terraform.tfstate"
          
          for LOCK_ID in "${BUCKET_NAME}/${STATE_KEY}" "${STATE_KEY}"; do
            terraform force-unlock -force "${LOCK_ID}" 2>&1 || true
          done
          
          SCAN_RESULT=$(aws dynamodb scan \
            --table-name "${TABLE_NAME}" \
            --region us-east-2 \
            --output json 2>/dev/null || echo '{"Items":[]}')
          
          if command -v jq >/dev/null 2>&1; then
            echo "$SCAN_RESULT" | jq -r '.Items[]?.LockID.S // empty' 2>/dev/null | while read LOCK_ID; do
              if echo "$LOCK_ID" | grep -q "${STATE_KEY}"; then
                aws dynamodb delete-item \
                  --table-name "${TABLE_NAME}" \
                  --key "{\"LockID\":{\"S\":\"${LOCK_ID}\"}}" \
                  --region us-east-2 2>&1 || true
              fi
            done
          else
            echo "$SCAN_RESULT" | grep -o '"LockID":\s*{"S":\s*"[^"]*"}' | grep -o '"[^"]*"' | tr -d '"' | grep -v "^LockID$" | while read LOCK_ID; do
              if echo "$LOCK_ID" | grep -q "${STATE_KEY}"; then
                aws dynamodb delete-item \
                  --table-name "${TABLE_NAME}" \
                  --key "{\"LockID\":{\"S\":\"${LOCK_ID}\"}}" \
                  --region us-east-2 2>&1 || true
              fi
            done
          fi
          echo "✓ Lock cleanup completed"
        working-directory: infrastructure/terraform
        continue-on-error: true

      - name: Import Existing Resources (if needed)
        run: |
          set +e  # Disable exit on error for this script
          echo "Checking for existing resources to import..."
          ENV="${{ needs.terraform-plan.outputs.environment }}"
          BUCKET_NAME="${{ steps.state-bucket-apply.outputs.bucket_name }}"
          
          if aws ecs describe-clusters --clusters "${ENV}-auth-service-cluster" --region us-east-2 --query 'clusters[0].status' --output text 2>/dev/null | grep -q "ACTIVE"; then
            echo "Importing existing ECS cluster..."
            terraform import \
              -var-file="environments/${ENV}/terraform.tfvars" \
              -var="db_username=${{ secrets.DB_USERNAME }}" \
              -var="db_password=${{ secrets.DB_PASSWORD }}" \
              -var="terraform_state_bucket_name=${BUCKET_NAME}" \
              module.ecs.aws_ecs_cluster.main "${ENV}-auth-service-cluster" 2>&1 || echo "ECS cluster already in state or import failed"
          fi
          
          # Get REST API ID, handling potential whitespace issues
          REST_API_ID=$(aws apigateway get-rest-apis --region us-east-2 --query "items[?name=='${ENV}-auth-service-api'].id" --output text 2>/dev/null | awk '{print $1}' | tr -d '\n\r\t ')
          if [ -n "${REST_API_ID}" ] && [ "${REST_API_ID}" != "None" ] && [ "${REST_API_ID}" != "" ]; then
            echo "Found REST API ID: ${REST_API_ID}"
            
            # Import REST API first (it's in root module, not api_gateway module)
            echo "Importing existing API Gateway REST API..."
            terraform import \
              -var-file="environments/${ENV}/terraform.tfvars" \
              -var="db_username=${{ secrets.DB_USERNAME }}" \
              -var="db_password=${{ secrets.DB_PASSWORD }}" \
              -var="terraform_state_bucket_name=${BUCKET_NAME}" \
              aws_api_gateway_rest_api.main "${REST_API_ID}" 2>&1 || echo "REST API already in state or import failed (this is OK if already managed)"
            
            # Try to import the stage - it may or may not exist
            # We'll attempt import and handle both cases gracefully
            STAGE_ID="${REST_API_ID}/${ENV}"
            echo "Attempting to import API Gateway stage with ID: ${STAGE_ID}"
            IMPORT_OUTPUT=$(terraform import \
              -var-file="environments/${ENV}/terraform.tfvars" \
              -var="db_username=${{ secrets.DB_USERNAME }}" \
              -var="db_password=${{ secrets.DB_PASSWORD }}" \
              -var="terraform_state_bucket_name=${BUCKET_NAME}" \
              module.api_gateway.aws_api_gateway_stage.main "${STAGE_ID}" 2>&1)
            IMPORT_EXIT_CODE=$?
            
            if [ ${IMPORT_EXIT_CODE} -eq 0 ]; then
              echo "✓ Successfully imported API Gateway stage"
            elif echo "${IMPORT_OUTPUT}" | grep -q "Resource already managed by Terraform"; then
              echo "✓ API Gateway stage already in state"
            elif echo "${IMPORT_OUTPUT}" | grep -q "Cannot import non-existent remote object"; then
              echo "API Gateway stage '${ENV}' does not exist yet, will be created by Terraform"
            else
              echo "API Gateway stage import result: ${IMPORT_OUTPUT}"
              echo "Will attempt to create stage if it doesn't exist"
            fi
          else
            echo "No existing REST API found for ${ENV}-auth-service-api, skipping imports"
          fi
          
          if aws elasticache describe-replication-groups \
            --replication-group-id "${ENV}-auth-service-redis" \
            --region us-east-2 >/dev/null 2>&1; then
            echo "Importing existing Redis replication group..."
            terraform import \
              -var-file="environments/${ENV}/terraform.tfvars" \
              -var="db_username=${{ secrets.DB_USERNAME }}" \
              -var="db_password=${{ secrets.DB_PASSWORD }}" \
              -var="terraform_state_bucket_name=${BUCKET_NAME}" \
              module.redis.aws_elasticache_replication_group.main "${ENV}-auth-service-redis" 2>&1 || echo "Redis already in state or import failed"
          fi
          exit 0  # Always exit successfully
        working-directory: infrastructure/terraform
        continue-on-error: true

      - name: Pre-Apply Disable Redis Auto-Failover
        run: |
          ENV="${{ needs.terraform-plan.outputs.environment }}"
          REDIS_GROUP="${ENV}-auth-service-redis"
          
          if aws elasticache describe-replication-groups \
            --replication-group-id "${REDIS_GROUP}" \
            --region us-east-2 >/dev/null 2>&1; then
            CURRENT_NODES=$(aws elasticache describe-replication-groups \
              --replication-group-id "${REDIS_GROUP}" \
              --region us-east-2 \
              --query 'ReplicationGroups[0].MemberClusters | length(@)' \
              --output text 2>/dev/null || echo "0")
            AUTO_FAILOVER=$(aws elasticache describe-replication-groups \
              --replication-group-id "${REDIS_GROUP}" \
              --region us-east-2 \
              --query 'ReplicationGroups[0].AutomaticFailover' \
              --output text 2>/dev/null || echo "disabled")
            
            TARGET_NODES=$(grep -E "^redis_num_cache_clusters\s*=" "environments/${ENV}/terraform.tfvars" | cut -d'=' -f2 | cut -d'#' -f1 | tr -d ' ' || echo "1")
            
            if [ "${CURRENT_NODES}" -ge 2 ] && [ "${TARGET_NODES}" -eq 1 ] && [ "${AUTO_FAILOVER}" = "enabled" ]; then
              echo "⚠️ Reducing Redis nodes from ${CURRENT_NODES} to ${TARGET_NODES}. Disabling auto-failover first..."
              aws elasticache modify-replication-group \
                --replication-group-id "${REDIS_GROUP}" \
                --no-automatic-failover-enabled \
                --apply-immediately \
                --region us-east-2 || echo "Failed to disable auto-failover (may already be disabled or not needed)"
              echo "Waiting for modification to complete..."
              aws elasticache wait replication-group-available \
                --replication-group-id "${REDIS_GROUP}" \
                --region us-east-2 || echo "Wait completed (may have timed out, continuing anyway)"
            fi
          fi
        working-directory: infrastructure/terraform
        continue-on-error: true

      - name: Terraform Apply
        run: |
          if [ -z "${{ secrets.DB_USERNAME }}" ] || [ -z "${{ secrets.DB_PASSWORD }}" ]; then
            echo "❌ Error: DB_USERNAME or DB_PASSWORD secrets are not set."
            echo "RDS cannot be created without database credentials."
            echo "Please set these secrets in GitHub repository settings and try again."
            exit 1
          fi
          
          echo "🚀 Applying Terraform plan..."
          terraform apply -auto-approve -no-color tfplan
          echo "✅ Terraform apply completed successfully"
        working-directory: infrastructure/terraform

      - name: Get database URL from Terraform outputs
        id: get-db-url
        run: |
          echo "Getting database URL from Terraform outputs after apply..."
          
          # Get database URL from outputs (use -json and jq for more reliable parsing)
          DATABASE_URL=$(terraform output -json database_url 2>/dev/null | jq -r '.value // empty' || echo "")
          
          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "null" ]; then
            echo "⚠️ Warning: Could not get database_url from Terraform outputs"
            echo "Attempting fallback method..."
            DATABASE_URL=$(terraform output -raw database_url 2>/dev/null || echo "")
          fi
          
          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "null" ]; then
            echo "⚠️ Warning: database_url is empty or not available"
            echo "database_url=" >> $GITHUB_OUTPUT
          else
            echo "✓ Database URL retrieved (hidden for security)"
            echo "database_url=${DATABASE_URL}" >> $GITHUB_OUTPUT
          fi
          
          # Debug: Show if output was set (without revealing the URL)
          if [ -n "$DATABASE_URL" ] && [ "$DATABASE_URL" != "null" ]; then
            echo "✓ Output set successfully (length: ${#DATABASE_URL} characters)"
          else
            echo "⚠️ Output is empty or null"
          fi
        working-directory: infrastructure/terraform
        continue-on-error: true

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_service_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_service_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [terraform-plan, terraform-apply, test, security, build]
    if: |
      github.ref == 'refs/heads/main' && 
      (
        github.event_name == 'workflow_dispatch' || 
        github.event_name == 'push'
      ) &&
      (
        (needs.terraform-plan.result == 'success' && needs.terraform-plan.outputs.has_infrastructure == 'true' && needs.terraform-apply.result == 'success') ||
        (
          (needs.terraform-plan.result == 'skipped' || (needs.terraform-plan.result == 'success' && needs.terraform-plan.outputs.has_infrastructure != 'true')) &&
          (needs.terraform-apply.result == 'skipped' || needs.terraform-apply.result == 'success')
        )
      )
    environment:
      name: ${{ needs.terraform-plan.outputs.environment || github.event.inputs.environment || 'dev' }}
      # No approval needed - approval was already given at terraform-apply step (if it ran)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Get ECS infrastructure details from Terraform
        id: get-ecs-details
        run: |
          echo "Getting ECS infrastructure details from Terraform outputs..."
          ENV="${{ needs.terraform-plan.outputs.environment || 'dev' }}"
          BUCKET_NAME="auth-service-terraform-state-${ENV}-${{ env.AWS_REGION }}"
          
          # Initialize Terraform to access outputs
          terraform init \
            -backend-config="bucket=${BUCKET_NAME}" \
            -backend-config="key=${ENV}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${BUCKET_NAME}-lock" \
            -reconfigure \
            -no-color
          
          # Get required values from Terraform outputs
          CLUSTER_NAME=$(terraform output -raw ecs_cluster_name 2>/dev/null || echo "")
          PRIVATE_SUBNETS=$(terraform output -json private_subnet_ids 2>/dev/null || echo "[]")
          SECURITY_GROUP=$(terraform output -raw ecs_security_group_id 2>/dev/null || echo "")
          
          # Get task definition ARN from ECS service
          if [ -n "$CLUSTER_NAME" ]; then
            SERVICE_NAME=$(terraform output -raw ecs_service_name 2>/dev/null || echo "")
            if [ -n "$SERVICE_NAME" ]; then
              TASK_DEF_ARN=$(aws ecs describe-services \
                --cluster "${CLUSTER_NAME}" \
                --services "${SERVICE_NAME}" \
                --region ${{ env.AWS_REGION }} \
                --query 'services[0].taskDefinition' \
                --output text 2>/dev/null || echo "")
            fi
          fi
          
          echo "cluster_name=${CLUSTER_NAME}" >> $GITHUB_OUTPUT
          echo "private_subnets=${PRIVATE_SUBNETS}" >> $GITHUB_OUTPUT
          echo "security_group=${SECURITY_GROUP}" >> $GITHUB_OUTPUT
          echo "task_def_arn=${TASK_DEF_ARN}" >> $GITHUB_OUTPUT
          
          if [ -z "$CLUSTER_NAME" ] || [ -z "$TASK_DEF_ARN" ] || [ "$PRIVATE_SUBNETS" = "[]" ] || [ -z "$SECURITY_GROUP" ]; then
            echo "⚠️ Warning: Some ECS infrastructure details are missing"
            echo "cluster_name=${CLUSTER_NAME}"
            echo "task_def_arn=${TASK_DEF_ARN}"
            echo "private_subnets=${PRIVATE_SUBNETS}"
            echo "security_group=${SECURITY_GROUP}"
          else
            echo "✓ ECS infrastructure details retrieved"
          fi
        working-directory: infrastructure/terraform
        continue-on-error: true

      - name: Build application
        run: npm run build

      - name: Create ECR repository if it doesn't exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Create ECS service-linked role if it doesn't exist
        run: |
          echo "Checking for ECS service-linked role..."
          if aws iam get-role --role-name AWSServiceRoleForECS 2>/dev/null; then
            echo "✓ ECS service-linked role already exists"
          else
            echo "Creating ECS service-linked role..."
            aws iam create-service-linked-role \
              --aws-service-name ecs.amazonaws.com || \
            echo "Note: Service-linked role creation may have failed (it might already exist or require manual creation)"
          fi

      - name: Create ECS cluster if it doesn't exist
        run: |
          aws ecs describe-clusters --clusters ${{ env.ECS_CLUSTER }} --region ${{ env.AWS_REGION }} --query 'clusters[0].status' --output text | grep -q ACTIVE || \
          aws ecs create-cluster \
            --cluster-name ${{ env.ECS_CLUSTER }} \
            --region ${{ env.AWS_REGION }} \
            --capacity-providers FARGATE FARGATE_SPOT \
            --default-capacity-provider-strategy capacityProvider=FARGATE,weight=1 capacityProvider=FARGATE_SPOT,weight=0

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache,mode=max
          platforms: linux/amd64

      - name: Get database URL from Terraform
        if: |
          steps.get-ecs-details.outcome == 'success' &&
          steps.build-image.outcome == 'success' &&
          (
            needs.terraform-apply.result == 'success' ||
            needs.terraform-plan.result == 'skipped'
          )
        id: get-database-url
        run: |
          echo "Getting database URL from Terraform outputs..."
          
          # Determine environment
          ENV="${{ needs.terraform-plan.outputs.environment || 'dev' }}"
          
          # Setup Terraform
          cd infrastructure/terraform
          terraform init \
            -backend-config="bucket=${{ needs.terraform-plan.outputs.state_bucket_name }}" \
            -backend-config="key=${ENV}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ needs.terraform-plan.outputs.state_bucket_name }}-lock" \
            -reconfigure
          
          # Get database URL from outputs
          DATABASE_URL=$(terraform output -json database_url 2>/dev/null | jq -r '.value // empty' || echo "")
          
          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "null" ]; then
            echo "⚠️ Warning: Could not get database_url from Terraform outputs"
            DATABASE_URL=$(terraform output -raw database_url 2>/dev/null || echo "")
          fi
          
          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "null" ]; then
            echo "❌ Error: database_url is not available from Terraform outputs"
            exit 1
          fi
          
          echo "✓ Database URL retrieved (hidden for security)"
          # Store in a way that can be used in the next step
          echo "DATABASE_URL=${DATABASE_URL}" >> $GITHUB_ENV
        continue-on-error: false

      - name: Run database migrations as ECS task
        if: |
          steps.get-ecs-details.outcome == 'success' &&
          steps.get-ecs-details.outputs.cluster_name != '' &&
          steps.build-image.outcome == 'success' &&
          steps.get-database-url.outcome == 'success' &&
          (
            needs.terraform-apply.result == 'success' ||
            needs.terraform-plan.result == 'skipped'
          )
        run: |
          echo "Running database migrations as one-time ECS task..."
          
          CLUSTER_NAME="${{ steps.get-ecs-details.outputs.cluster_name }}"
          # Get the ECR registry and construct the image URI
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          # Use the same tag format as the build step (latest or commit SHA)
          IMAGE_TAG="latest"
          FULL_IMAGE_URI="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          
          # Get the existing task definition to use as a template
          EXISTING_TASK_DEF_ARN="${{ steps.get-ecs-details.outputs.task_def_arn }}"
          SUBNETS="${{ steps.get-ecs-details.outputs.private_subnets }}"
          SECURITY_GROUP="${{ steps.get-ecs-details.outputs.security_group }}"
          DATABASE_URL="${DATABASE_URL}"
          
          echo "Using newly built image: ${FULL_IMAGE_URI}"
          echo "Base task definition: ${EXISTING_TASK_DEF_ARN}"
          
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ Error: DATABASE_URL is not set"
            exit 1
          fi
          
          # Get the task definition JSON and update it to use the new image
          TASK_DEF_JSON=$(aws ecs describe-task-definition \
            --task-definition "${EXISTING_TASK_DEF_ARN}" \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' \
            --output json)
          
          # Update the image in the task definition JSON
          UPDATED_TASK_DEF_JSON=$(echo "$TASK_DEF_JSON" | jq --arg img "$FULL_IMAGE_URI" '.containerDefinitions[0].image = $img | del(.taskDefinitionArn) | del(.revision) | del(.status) | del(.requiresAttributes) | del(.compatibilities) | del(.registeredAt) | del(.registeredBy)')
          
          # Register a new task definition revision with the new image
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$UPDATED_TASK_DEF_JSON" \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "Registered new task definition for migrations: ${NEW_TASK_DEF_ARN}"
          TASK_DEF_ARN="${NEW_TASK_DEF_ARN}"
          
          # Create network configuration JSON
          # SUBNETS may be in different formats from Terraform/GitHub Actions
          # Handle both valid JSON arrays and unquoted array formats
          
          # Try parsing as valid JSON first
          if echo "$SUBNETS" | jq -e '.' >/dev/null 2>&1; then
            SUBNETS_JSON=$(echo "$SUBNETS" | jq -c '.')
          else
            # If not valid JSON, it might be unquoted like [subnet-xxx,subnet-yyy]
            # Convert to proper JSON by splitting on comma and wrapping in quotes
            SUBNETS_JSON=$(echo "$SUBNETS" | \
              sed 's/\[//;s/\]//' | \
              awk -F',' '{printf "["; for(i=1;i<=NF;i++) {gsub(/^[ \t]+|[ \t]+$/, "", $i); if(i>1) printf ","; printf "\"%s\"", $i} printf "]"}')
            
            # Validate the result
            if ! echo "$SUBNETS_JSON" | jq -e '.' >/dev/null 2>&1; then
              echo "❌ Error: Failed to parse SUBNETS: $SUBNETS"
              exit 1
            fi
          fi
          
          NETWORK_CONFIG=$(jq -n \
            --argjson subnets "$SUBNETS_JSON" \
            --arg sg "$SECURITY_GROUP" \
            '{
              "awsvpcConfiguration": {
                "subnets": $subnets,
                "securityGroups": [$sg],
                "assignPublicIp": "DISABLED"
              }
            }')
          
          echo "Cluster: ${CLUSTER_NAME}"
          echo "Task Definition: ${TASK_DEF_ARN}"
          echo "Network Config: ${NETWORK_CONFIG}"
          
          # Run one-time ECS task with migration command
          # Pass DATABASE_URL as environment variable override
          # Note: environment variables in overrides use "environment" array
          OVERRIDES_JSON=$(jq -n \
            --arg db_url "$DATABASE_URL" \
            '{
              "containerOverrides": [{
                "name": "auth-service",
                "command": ["sh", "-c", "npm run migrate:up"],
                "environment": [
                  {
                    "name": "DATABASE_URL",
                    "value": $db_url
                  }
                ]
              }]
            }')
          
          TASK_ARN=$(aws ecs run-task \
            --cluster "${CLUSTER_NAME}" \
            --task-definition "${TASK_DEF_ARN}" \
            --launch-type FARGATE \
            --network-configuration "${NETWORK_CONFIG}" \
            --overrides "${OVERRIDES_JSON}" \
            --region ${{ env.AWS_REGION }} \
            --query 'tasks[0].taskArn' \
            --output text)
          
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "❌ Error: Failed to start migration task"
            exit 1
          fi
          
          echo "Migration task started: ${TASK_ARN}"
          echo "Waiting for migration task to complete (this may take a few minutes)..."
          
          # Use AWS CLI's optimized wait command (uses exponential backoff, most efficient)
          # This is the cheapest and most reliable approach - AWS handles retries internally
          if ! aws ecs wait tasks-stopped \
            --cluster "${CLUSTER_NAME}" \
            --tasks "${TASK_ARN}" \
            --region ${{ env.AWS_REGION }}; then
            echo "⚠️ Warning: Task wait timed out or failed, checking task status..."
          fi
          
          # Get task status and exit code (single API call for both)
          TASK_INFO=$(aws ecs describe-tasks \
            --cluster "${CLUSTER_NAME}" \
            --tasks "${TASK_ARN}" \
            --region ${{ env.AWS_REGION }} \
            --query 'tasks[0].{status:lastStatus,exitCode:containers[0].exitCode,stopCode:stopCode,stoppedReason:stoppedReason}' \
            --output json)
          
          TASK_STATUS=$(echo "$TASK_INFO" | jq -r '.status // "UNKNOWN"')
          EXIT_CODE=$(echo "$TASK_INFO" | jq -r '.exitCode // "null"')
          STOP_CODE=$(echo "$TASK_INFO" | jq -r '.stopCode // "null"')
          STOPPED_REASON=$(echo "$TASK_INFO" | jq -r '.stoppedReason // "null"')
          
          echo "Task status: ${TASK_STATUS}"
          if [ "$STOP_CODE" != "null" ] && [ "$STOP_CODE" != "" ]; then
            echo "Stop code: ${STOP_CODE}"
          fi
          if [ "$STOPPED_REASON" != "null" ] && [ "$STOPPED_REASON" != "" ]; then
            echo "Stopped reason: ${STOPPED_REASON}"
          fi
          
          # Fetch logs with retry (CloudWatch logs can take a few seconds to propagate)
          LOG_GROUP="/ecs/${{ needs.terraform-plan.outputs.environment || 'dev' }}-auth-service"
          TASK_ID="${TASK_ARN##*/}"
          CONTAINER_NAME="auth-service"
          
          echo "Fetching logs from CloudWatch (log group: ${LOG_GROUP})..."
          LOG_STREAM=""
          MAX_RETRIES=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            LOG_STREAM=$(aws logs describe-log-streams \
              --log-group-name "${LOG_GROUP}" \
              --log-stream-name-prefix "ecs/${CONTAINER_NAME}/${TASK_ID}" \
              --region ${{ env.AWS_REGION }} \
              --order-by LastEventTime \
              --descending \
              --max-items 1 \
              --query 'logStreams[0].logStreamName' \
              --output text 2>/dev/null || echo "")
            
            if [ -n "$LOG_STREAM" ] && [ "$LOG_STREAM" != "None" ] && [ "$LOG_STREAM" != "" ]; then
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Logs not available yet, retrying in 3 seconds... (attempt $RETRY_COUNT/$MAX_RETRIES)"
              sleep 3
            fi
          done
          
          if [ -n "$LOG_STREAM" ] && [ "$LOG_STREAM" != "None" ] && [ "$LOG_STREAM" != "" ]; then
            echo "=== Migration Task Logs ==="
            aws logs get-log-events \
              --log-group-name "${LOG_GROUP}" \
              --log-stream-name "${LOG_STREAM}" \
              --region ${{ env.AWS_REGION }} \
              --query 'events[*].message' \
              --output text 2>/dev/null || echo "Could not retrieve log events"
            echo "=============================="
          else
            echo "⚠️ Warning: Could not retrieve logs after ${MAX_RETRIES} attempts"
            echo "Log group: ${LOG_GROUP}"
            echo "Task ID: ${TASK_ID}"
            echo "You can view logs manually in AWS CloudWatch Console"
          fi
          
          # Check exit code - this is the authoritative success/failure indicator
          if [ "$EXIT_CODE" = "0" ]; then
            echo "✅ Database migrations completed successfully"
          elif [ "$EXIT_CODE" = "null" ] || [ -z "$EXIT_CODE" ]; then
            echo "❌ Error: Could not determine task exit code. Task status: ${TASK_STATUS}"
            if [ "$TASK_STATUS" != "STOPPED" ]; then
              echo "Task may still be running or in an unexpected state."
            fi
            exit 1
          else
            echo "❌ Error: Migration task failed with exit code: ${EXIT_CODE}"
            exit 1
          fi

      - name: Verify ECS service exists
        run: |
          echo "Verifying ECS service exists (should be created via Terraform)..."
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].status' \
            --output text 2>/dev/null || echo "NOT_FOUND")
          
          if [ "$SERVICE_STATUS" = "ACTIVE" ] || [ "$SERVICE_STATUS" = "DRAINING" ]; then
            echo "✓ ECS service exists and is $SERVICE_STATUS"
          else
            echo "❌ Error: ECS service '${{ env.ECS_SERVICE }}' not found in cluster '${{ env.ECS_CLUSTER }}'"
            echo ""
            echo "The ECS service must be created via Terraform first."
            echo "Please run: cd infrastructure/terraform && terraform apply"
            echo ""
            echo "Required infrastructure (managed by Terraform):"
            echo "  - VPC with public and private subnets"
            echo "  - ECS cluster"
            echo "  - ECS service"
            echo "  - Security groups"
            echo "  - Load balancer (ALB)"
            exit 1
          fi

      - name: Update ECS service
        id: update-service
        run: |
          echo "Updating ECS service: ${{ env.ECS_SERVICE }} in cluster: ${{ env.ECS_CLUSTER }}"
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} \
            --query 'service.{ServiceName:serviceName,Status:status,DesiredCount:desiredCount,RunningCount:runningCount}' \
            --output json > service-info.json
          
          cat service-info.json
          
          TASK_DEF=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].taskDefinition' \
            --output text)
          
          echo "task-definition=$TASK_DEF" >> $GITHUB_OUTPUT

      - name: Wait for ECS service to be stable
        run: |
          echo "Waiting for ECS service to reach stable state..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}
          
          echo "Service is now stable!"

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].{Status:status,RunningCount:runningCount,DesiredCount:desiredCount}' \
            --output json)
          
          echo "Service status: $SERVICE_STATUS"
          
          RUNNING_COUNT=$(echo $SERVICE_STATUS | jq -r '.RunningCount')
          DESIRED_COUNT=$(echo $SERVICE_STATUS | jq -r '.DesiredCount')
          
          if [ "$RUNNING_COUNT" -lt "$DESIRED_COUNT" ]; then
            echo "Error: Running count ($RUNNING_COUNT) is less than desired count ($DESIRED_COUNT)"
            exit 1
          fi
          
          echo "Deployment verified successfully!"

      - name: Run smoke tests
        if: success()
        run: |
          echo "Smoke tests would run here"
          echo "Example: curl -f ${{ secrets.API_URL || 'https://api.example.com' }}/health || exit 1"
