name: Infrastructure Deployment

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infrastructure.yml'

env:
  AWS_REGION: us-east-2
  TF_VERSION: '1.6.0'

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create S3 bucket for Terraform state if needed
        if: secrets.TERRAFORM_STATE_BUCKET != ''
        run: |
          BUCKET_NAME="${{ secrets.TERRAFORM_STATE_BUCKET }}"
          
          # Check if bucket exists
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "✓ S3 bucket '$BUCKET_NAME' already exists"
          else
            echo "Creating S3 bucket '$BUCKET_NAME' for Terraform state..."
            
            # Create bucket
            if [ "${{ env.AWS_REGION }}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region "${{ env.AWS_REGION }}"
            else
              aws s3api create-bucket \
                --bucket "$BUCKET_NAME" \
                --region "${{ env.AWS_REGION }}" \
                --create-bucket-configuration LocationConstraint="${{ env.AWS_REGION }}"
            fi
            
            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET_NAME" \
              --versioning-configuration Status=Enabled
            
            # Enable encryption
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET_NAME" \
              --server-side-encryption-configuration '{
                "Rules": [{
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }]
              }'
            
            # Block public access
            aws s3api put-public-access-block \
              --bucket "$BUCKET_NAME" \
              --public-access-block-configuration \
                "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            
            echo "✓ S3 bucket '$BUCKET_NAME' created and configured"
          fi

      - name: Create DynamoDB table for state locking if needed
        if: secrets.TERRAFORM_STATE_BUCKET != ''
        run: |
          TABLE_NAME="${{ secrets.TERRAFORM_STATE_BUCKET }}-lock"
          
          # Check if table exists
          if aws dynamodb describe-table --table-name "$TABLE_NAME" --region "${{ env.AWS_REGION }}" 2>/dev/null; then
            echo "✓ DynamoDB table '$TABLE_NAME' already exists"
          else
            echo "Creating DynamoDB table '$TABLE_NAME' for Terraform state locking..."
            
            aws dynamodb create-table \
              --table-name "$TABLE_NAME" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${{ env.AWS_REGION }}" \
              --tags Key=Name,Value="Terraform State Lock" Key=ManagedBy,Value=terraform
            
            echo "Waiting for table to be active..."
            aws dynamodb wait table-exists --table-name "$TABLE_NAME" --region "${{ env.AWS_REGION }}"
            
            echo "✓ DynamoDB table '$TABLE_NAME' created"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          if [ -n "${{ secrets.TERRAFORM_STATE_BUCKET }}" ]; then
            echo "Initializing Terraform with S3 backend..."
            terraform init \
              -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
              -backend-config="key=${{ github.event.inputs.environment || 'dev' }}/terraform.tfstate" \
              -backend-config="region=${{ env.AWS_REGION }}" \
              -backend-config="encrypt=true" \
              -backend-config="dynamodb_table=${{ secrets.TERRAFORM_STATE_BUCKET }}-lock"
          else
            echo "No S3 backend configured - initializing with local backend"
            terraform init -backend=false
          fi
        working-directory: infrastructure/terraform

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: infrastructure/terraform

      - name: Terraform Plan
        id: plan
        if: github.event.inputs.action == 'plan' || github.event_name == 'push'
        run: |
          terraform plan \
            -var-file="environments/${{ github.event.inputs.environment || 'dev' }}/terraform.tfvars" \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -out=tfplan \
            -no-color
        working-directory: infrastructure/terraform
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Check Auto-Apply Setting
        id: check-auto-apply
        run: |
          if [ "${{ vars.TERRAFORM_AUTO_APPLY }}" = "true" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "auto_apply=true" >> $GITHUB_OUTPUT
          else
            echo "auto_apply=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Apply
        # Apply runs when:
        # 1. Manually triggered with action='apply'
        # 2. Auto-apply is enabled via repository variable and this is a push event
        if: |
          github.event.inputs.action == 'apply' ||
          (github.event_name == 'push' && steps.check-auto-apply.outputs.auto_apply == 'true')
        run: terraform apply -auto-approve -no-color tfplan
        working-directory: infrastructure/terraform

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -no-color
        working-directory: infrastructure/terraform
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: ${{ github.event_name }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

