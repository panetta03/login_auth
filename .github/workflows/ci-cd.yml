name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    # Note: We check for infrastructure changes in the deploy job's if condition
    # This ensures CI/CD doesn't run if infrastructure files are changed
  workflow_dispatch:  # Can be triggered manually or by Infrastructure workflow
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: auth-service
  # Default to dev-* names (Terraform default environment)
  # Override via secrets to match your Terraform environment:
  #   - dev: dev-auth-service-cluster / dev-auth-service
  #   - prod: prod-auth-service-cluster / prod-auth-service
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER || 'dev-auth-service-cluster' }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE || 'dev-auth-service' }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_service_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_service_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          # Google OAuth credentials from GitHub Secrets (required for integration tests)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  check-infrastructure-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      has_infrastructure_changes: ${{ steps.check.outputs.has_infrastructure }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for infrastructure changes
        id: check
        run: |
          # Check if any infrastructure files changed in this commit
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(infrastructure/|\.github/workflows/infrastructure\.yml|\.github/workflows/promote-to-prod\.yml)'; then
            echo "has_infrastructure=true" >> $GITHUB_OUTPUT
            echo "❌ Infrastructure files changed - CI/CD will be skipped (Infrastructure workflow will trigger CI/CD instead)"
          else
            echo "has_infrastructure=false" >> $GITHUB_OUTPUT
            echo "✅ No infrastructure changes - CI/CD can proceed"
          fi

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-infrastructure-changes, test, security, build]
    if: |
      github.ref == 'refs/heads/main' && 
      (
        github.event_name == 'workflow_dispatch' || 
        (github.event_name == 'push' && 
         (needs.check-infrastructure-changes.outputs.has_infrastructure_changes != 'true' || needs.check-infrastructure-changes.result == 'skipped'))
      )
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
      # Defaults to dev, can be overridden via workflow_dispatch input
      # When triggered by Infrastructure workflow, environment is passed via inputs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Build application
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR repository if it doesn't exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Create ECS service-linked role if it doesn't exist
        run: |
          echo "Checking for ECS service-linked role..."
          if aws iam get-role --role-name AWSServiceRoleForECS 2>/dev/null; then
            echo "✓ ECS service-linked role already exists"
          else
            echo "Creating ECS service-linked role..."
            aws iam create-service-linked-role \
              --aws-service-name ecs.amazonaws.com || \
            echo "Note: Service-linked role creation may have failed (it might already exist or require manual creation)"
          fi

      - name: Create ECS cluster if it doesn't exist
        run: |
          aws ecs describe-clusters --clusters ${{ env.ECS_CLUSTER }} --region ${{ env.AWS_REGION }} --query 'clusters[0].status' --output text | grep -q ACTIVE || \
          aws ecs create-cluster \
            --cluster-name ${{ env.ECS_CLUSTER }} \
            --region ${{ env.AWS_REGION }} \
            --capacity-providers FARGATE FARGATE_SPOT \
            --default-capacity-provider-strategy capacityProvider=FARGATE,weight=1 capacityProvider=FARGATE_SPOT,weight=0

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache,mode=max
          platforms: linux/amd64

      - name: Verify ECS service exists
        run: |
          echo "Verifying ECS service exists (should be created via Terraform)..."
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].status' \
            --output text 2>/dev/null || echo "NOT_FOUND")
          
          if [ "$SERVICE_STATUS" = "ACTIVE" ] || [ "$SERVICE_STATUS" = "DRAINING" ]; then
            echo "✓ ECS service exists and is $SERVICE_STATUS"
          else
            echo "❌ Error: ECS service '${{ env.ECS_SERVICE }}' not found in cluster '${{ env.ECS_CLUSTER }}'"
            echo ""
            echo "The ECS service must be created via Terraform first."
            echo "Please run: cd infrastructure/terraform && terraform apply"
            echo ""
            echo "Required infrastructure (managed by Terraform):"
            echo "  - VPC with public and private subnets"
            echo "  - ECS cluster"
            echo "  - ECS service"
            echo "  - Security groups"
            echo "  - Load balancer (ALB)"
            exit 1
          fi

      - name: Update ECS service
        id: update-service
        run: |
          echo "Updating ECS service: ${{ env.ECS_SERVICE }} in cluster: ${{ env.ECS_CLUSTER }}"
          # Force new deployment to pull the latest image (latest tag)
          # Note: Task definition is managed by Terraform, we just force a new deployment
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} \
            --query 'service.{ServiceName:serviceName,Status:status,DesiredCount:desiredCount,RunningCount:runningCount}' \
            --output json > service-info.json
          
          cat service-info.json
          
          # Extract task definition ARN for later use
          TASK_DEF=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].taskDefinition' \
            --output text)
          
          echo "task-definition=$TASK_DEF" >> $GITHUB_OUTPUT

      - name: Wait for ECS service to be stable
        run: |
          echo "Waiting for ECS service to reach stable state..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}
          
          echo "Service is now stable!"

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].{Status:status,RunningCount:runningCount,DesiredCount:desiredCount}' \
            --output json)
          
          echo "Service status: $SERVICE_STATUS"
          
          RUNNING_COUNT=$(echo $SERVICE_STATUS | jq -r '.RunningCount')
          DESIRED_COUNT=$(echo $SERVICE_STATUS | jq -r '.DesiredCount')
          
          if [ "$RUNNING_COUNT" -lt "$DESIRED_COUNT" ]; then
            echo "Error: Running count ($RUNNING_COUNT) is less than desired count ($DESIRED_COUNT)"
            exit 1
          fi
          
          echo "Deployment verified successfully!"

      - name: Run smoke tests
        if: success()
        run: |
          echo "Smoke tests would run here"
          echo "Example: curl -f ${{ secrets.API_URL || 'https://api.example.com' }}/health || exit 1"
          # Uncomment and configure when API URL is available:
          # API_URL="${{ secrets.API_URL }}"
          # if [ -n "$API_URL" ]; then
          #   echo "Testing health endpoint: $API_URL/health"
          #   curl -f "$API_URL/health" || exit 1
          #   echo "Health check passed!"
          # else
          #   echo "API_URL secret not set, skipping smoke tests"
          # fi
